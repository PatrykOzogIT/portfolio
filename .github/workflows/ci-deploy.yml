# CI/CD: every push and pull request is verified; pushes to main are deployed over FTPS.
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: DEPLOY_ENABLED = true        (deployment stays off until this is set)
#              FTP_SERVER_DIR = public_html/  (web root as seen by the FTP account — required, no default;
#                                              a DirectAdmin domain FTP account starts in domains/<domain>/)
#              FTP_SECURITY   = strict      (optional: "loose" if the host's certificate does not match)
# See docs/DEPLOYMENT.md.

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would be uploaded or deleted, without changing the server
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; a run on main is never interrupted mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts

      - name: End-to-end tests (fixture build)
        run: |
          npm run build:e2e
          npx playwright test

      - name: Production build
        run: npm run build

      - name: Guard — production output contains no test fixtures
        run: |
          if grep -rqE "BETA-HIDDEN|Alpha PL|Gamma PL" dist/portfolio/browser; then
            echo "::error::Fixture content found in the production build"; exit 1
          fi
          test -f dist/portfolio/browser/.htaccess

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/portfolio/browser
          include-hidden-files: true # .htaccess
          retention-days: 7

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  deploy:
    name: Deploy to patryk-ozog.pl
    needs: verify
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 15
    environment:
      name: production
      url: https://patryk-ozog.pl
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Check the deployment target
        env:
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          if [ -z "$SERVER_DIR" ]; then
            echo "::error::Repository variable FTP_SERVER_DIR is not set (e.g. public_html/). Refusing to guess the target folder."
            exit 1
          fi
          echo "Deploying to: $SERVER_DIR"

      - name: Check the artifact
        run: |
          test -f site/.htaccess
          test -f site/pl/index.html
          test -f site/en/index.html

      # Incremental: uploads only changed files and deletes only files it uploaded before
      # (tracked in .ftp-deploy-sync-state.json on the server) — never anything else.
      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Smoke test the live site
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -e
          sleep 5
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept-Language: $3" "$1"); \
            echo "$1 → $code"; [ "$code" = "$2" ]; }
          check https://patryk-ozog.pl/pl 200 pl
          check https://patryk-ozog.pl/en 200 en
          check https://patryk-ozog.pl/ 302 pl
          check https://patryk-ozog.pl/pl/does-not-exist 404 pl
          curl -s https://patryk-ozog.pl/pl | grep -q '<link rel="canonical" href="https://patryk-ozog.pl/pl"'
