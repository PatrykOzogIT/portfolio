<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patryk Ożóg — podgląd koncepcji</title>
<meta name="robots" content="noindex">
<!-- W produkcji fonty będą hostowane lokalnie (woff2, subset latin + latin-ext). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — cała identyfikacja w jednym miejscu.
   Zmiana palety = zmiana wartości poniżej.
   ============================================================ */
:root {
  color-scheme: dark;

  --bg: #0B0D12;
  --surface-1: #11141B;
  --surface-2: #171B24;
  --surface-3: #1E2330;
  --border: rgb(255 255 255 / .08);
  --border-strong: rgb(255 255 255 / .16);

  --text: #E8EAF0;
  --text-2: #A3A9B8;
  --text-3: #8A91A1;

  --accent: #8B93FF;
  --accent-strong: #A5ABFF;
  --on-accent: #0B0D12;

  --sys-b2b: #5CC8E6;
  --sys-erp: #8B93FF;
  --sys-wms: #F2B35B;

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 20px;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --t-fast: 120ms;
  --t-base: 200ms;
  --t-slow: 320ms;

  --header-h: 64px;
  --container: 1200px;
  --gutter: 20px;
}
@media (min-width: 768px)  { :root { --gutter: 24px; } }
@media (min-width: 1280px) { :root { --gutter: 32px; } }

/* ============================================================ BASE */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-optical-sizing: auto;
  font-size: clamp(1rem, .96rem + .12vw, 1.0625rem);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
h1, h2, h3, h4, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.container { width: min(100% - 2 * var(--gutter), var(--container)); margin-inline: auto; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.skip-link {
  position: absolute; left: 16px; top: -100px; z-index: 100;
  background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: var(--r-md); font-weight: 600;
}
.skip-link:focus { top: 12px; }

.mono {
  font-family: var(--font-mono);
  font-size: .78rem;
  letter-spacing: .06em;
  text-transform: uppercase;
}

/* ============================================================ BUTTONS */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 20px;
  border-radius: var(--r-md); border: 1px solid transparent;
  font-weight: 600; font-size: .975rem; line-height: 1;
  cursor: pointer; white-space: nowrap;
  transition: background var(--t-base) var(--ease), border-color var(--t-base) var(--ease),
              color var(--t-base) var(--ease), transform var(--t-fast) var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--primary:hover { background: var(--accent-strong); }
.btn--secondary { background: var(--surface-2); border-color: var(--border-strong); }
.btn--secondary:hover { background: var(--surface-3); border-color: rgb(255 255 255 / .24); }
.btn--sm { min-height: 40px; padding: 0 14px; font-size: .9rem; }
.btn .arrow { transition: transform var(--t-base) var(--ease); }
.btn:hover .arrow { transform: translateX(3px); }

.link-arrow {
  display: inline-flex; align-items: center; gap: 8px; min-height: 48px;
  color: var(--text-2); font-weight: 500;
  transition: color var(--t-base) var(--ease);
}
.link-arrow svg { width: 16px; height: 16px; transition: transform var(--t-base) var(--ease); }
.link-arrow:hover { color: var(--text); }
.link-arrow:hover svg { transform: translateX(3px); }

/* ============================================================ HEADER */
.site-header {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  border-bottom: 1px solid transparent;
  transition: background var(--t-slow) var(--ease), border-color var(--t-slow) var(--ease);
}
.site-header.is-scrolled {
  background: rgb(11 13 18 / .78);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  border-bottom-color: var(--border);
}
.header-inner { height: 100%; display: flex; align-items: center; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: -.01em; min-height: 44px; }
.brand-mark {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: linear-gradient(180deg, var(--surface-3), var(--surface-1));
  font-family: var(--font-mono); font-size: .75rem; letter-spacing: .02em; color: var(--accent-strong);
}
.brand-name { display: none; }
@media (min-width: 420px) { .brand-name { display: inline; } }

.main-nav { margin-left: auto; display: none; }
.main-nav ul { display: flex; gap: 2px; }
.nav-link {
  position: relative; display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px;
  color: var(--text-2); font-size: .935rem; font-weight: 500; border-radius: var(--r-sm);
  transition: color var(--t-base) var(--ease);
}
.nav-link:hover { color: var(--text); }
.nav-link[aria-current="true"] { color: var(--text); }
.nav-link::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2px; border-radius: 2px;
  background: var(--accent); transform: scaleX(0); transition: transform var(--t-slow) var(--ease);
}
.nav-link[aria-current="true"]::after { transform: scaleX(1); }

.header-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.lang-switch {
  display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px;
  background: var(--surface-1); border: 1px solid var(--border);
}
.lang-switch button {
  min-width: 40px; min-height: 34px; border: 0; border-radius: 7px; background: transparent; cursor: pointer;
  font-family: var(--font-mono); font-size: .75rem; letter-spacing: .06em; color: var(--text-3);
  transition: background var(--t-base) var(--ease), color var(--t-base) var(--ease);
}
.lang-switch button:hover { color: var(--text); }
.lang-switch button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.header-cta { display: none; }
.menu-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-md);
  background: transparent; border: 1px solid var(--border); cursor: pointer;
}
.menu-btn svg { width: 20px; height: 20px; }

@media (min-width: 960px) {
  .main-nav { display: block; }
  .header-actions { margin-left: 8px; }
  .header-cta { display: inline-flex; }
  .menu-btn { display: none; }
}

/* Mobile nav — natywny <dialog>: focus trap, Escape i inert tła za darmo */
.mnav {
  margin: 0; padding: 0; border: 0; width: 100%; max-width: none; height: 100dvh; max-height: none;
  background: var(--bg); color: var(--text);
}
.mnav::backdrop { background: rgb(0 0 0 / .5); }
.mnav[open] { animation: sheet-in var(--t-slow) var(--ease); }
@keyframes sheet-in { from { opacity: 0; transform: translateY(-8px); } }
.mnav-head { height: var(--header-h); display: flex; align-items: center; justify-content: space-between; }
.mnav-list { display: grid; gap: 4px; margin-top: 24px; }
.mnav-list a {
  display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 4px;
  font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; border-bottom: 1px solid var(--border);
}
.mnav-list a[aria-current="true"] { color: var(--accent-strong); }
.mnav-list svg { width: 20px; height: 20px; color: var(--text-3); }
.mnav-foot { margin-top: 32px; display: grid; gap: 12px; }

/* ============================================================ HERO */
.hero { position: relative; isolation: isolate; overflow: clip; padding-block: clamp(40px, 7vw, 104px) clamp(64px, 8vw, 120px); }
.hero::before {
  content: ""; position: absolute; z-index: -1; pointer-events: none;
  width: min(900px, 120vw); aspect-ratio: 1; right: -20%; top: -30%;
  background: radial-gradient(closest-side, rgb(139 147 255 / .13), rgb(92 200 230 / .04) 55%, transparent);
}
.hero-grid { display: grid; gap: 48px; align-items: center; }
@media (min-width: 1024px) { .hero-grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 32px; } }

.eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--text-2); }
.eyebrow::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 4px rgb(139 147 255 / .15);
}
.hero h1 {
  margin-top: 20px;
  font-size: clamp(2.5rem, 1.55rem + 4.2vw, 4.6rem);
  font-weight: 650; letter-spacing: -.035em; line-height: 1.02;
}
.hero-lead {
  margin-top: 24px; max-width: 34em;
  font-size: clamp(1.125rem, 1.02rem + .4vw, 1.3rem); line-height: 1.55; color: var(--text-2);
}
.hero-keys { margin-top: 20px; color: var(--text-3); font-size: .74rem; }
.hero-cta { margin-top: 36px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 12px; }
.hero-cta .link-arrow { margin-left: 8px; }
@media (max-width: 479px) {
  .hero-cta .btn { flex: 1 1 100%; }
  .hero-cta .link-arrow { margin-left: 0; }
}

.hero-visual { width: 100%; max-width: 560px; margin-inline: auto; }
@media (max-width: 1023px) { .hero-visual { max-width: 440px; } }
@media (max-width: 639px)  { .hero-visual { max-width: 340px; opacity: .85; } .hero-visual .optional { display: none; } }
.hero-visual svg { width: 100%; height: auto; overflow: visible; }
.hv-layer { transition: transform 600ms var(--ease); }
.ctx { fill: rgb(255 255 255 / .015); stroke: rgb(255 255 255 / .08); stroke-dasharray: 3 5; }
.mod { fill: var(--surface-2); stroke: rgb(255 255 255 / .1); }
.mod-hl { fill: var(--accent); opacity: 0; transition: opacity 400ms var(--ease); pointer-events: none; }
.wire { fill: none; stroke: rgb(255 255 255 / .13); stroke-width: 1.25; }
.signal {
  fill: none; stroke: var(--accent-strong); stroke-width: 2; stroke-linecap: round;
  stroke-dasharray: 6 200; stroke-dashoffset: 6; opacity: 0;
  animation: signal 7.2s linear infinite;
}
@keyframes signal {
  0%   { stroke-dashoffset: 6; opacity: 0; }
  4%   { opacity: .95; }
  36%  { opacity: .95; }
  40%  { stroke-dashoffset: -100; opacity: 0; }
  100% { stroke-dashoffset: -100; opacity: 0; }
}

/* ============================================================ SECTIONS */
.section { padding-block: clamp(64px, 9vw, 128px); }
.section + .section { border-top: 1px solid var(--border); }
.section-eyebrow { color: var(--accent-strong); }
.section h2 {
  margin-top: 14px; max-width: 22em;
  font-size: clamp(1.875rem, 1.35rem + 2.1vw, 2.85rem);
  font-weight: 620; letter-spacing: -.025em; line-height: 1.1;
}
.section-lead { margin-top: 18px; max-width: 42em; color: var(--text-2); font-size: clamp(1.05rem, 1rem + .2vw, 1.15rem); }
.section-note { margin-top: 12px; color: var(--text-3); font-size: .875rem; }

.stub {
  margin-top: 32px; padding: 24px; border-radius: var(--r-lg);
  border: 1px dashed var(--border-strong); color: var(--text-3);
}

/* ============================================================ ECOSYSTEM */
.eco-layout { margin-top: clamp(40px, 5vw, 64px); display: grid; gap: 28px; }
@media (min-width: 1100px) {
  .eco-layout { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .eco-map-wrap { position: sticky; top: calc(var(--header-h) + 32px); }
}

.eco-map { position: relative; }
.eco-map::before { /* blueprint dot grid, tylko w obrębie mapy */
  content: ""; position: absolute; inset: -24px -16px; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgb(255 255 255 / .07) 1px, transparent 1.2px);
  background-size: 20px 20px;
  -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent);
  mask-image: radial-gradient(closest-side, #000 55%, transparent);
}

.eco-cols {
  position: relative; z-index: 3;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, auto);
  gap: 0 clamp(8px, 2.4vw, 24px);
}

/* subgrid: nagłówki, frontendy i API wszystkich systemów zawsze w tych samych rzędach */
.sys {
  --c: var(--accent);
  position: relative; display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: 14px;
  padding: 12px; border-radius: 18px; text-align: left;
  background: transparent; border: 1px solid transparent; cursor: pointer;
  transition: background var(--t-slow) var(--ease), border-color var(--t-slow) var(--ease), box-shadow var(--t-slow) var(--ease);
}
.sys[data-sys="b2b"] { --c: var(--sys-b2b); }
.sys[data-sys="erp"] { --c: var(--sys-erp); }
.sys[data-sys="wms"] { --c: var(--sys-wms); }
@media (hover: hover) { .sys:hover { border-color: var(--border); background: rgb(255 255 255 / .015); } }
.sys[aria-selected="true"] {
  border-color: color-mix(in srgb, var(--c) 42%, transparent);
  background: color-mix(in srgb, var(--c) 6%, transparent);
  box-shadow: 0 24px 64px -32px color-mix(in srgb, var(--c) 55%, transparent);
}
.sys:focus-visible { outline-offset: 4px; border-radius: 18px; }

.sys-head { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.sys-icon {
  flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px;
  background: color-mix(in srgb, var(--c) 12%, var(--surface-1));
  border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
  color: var(--c); transition: box-shadow var(--t-slow) var(--ease);
}
.sys-icon svg { width: 21px; height: 21px; }
.sys[aria-selected="true"] .sys-icon { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 12%, transparent), 0 0 28px -4px color-mix(in srgb, var(--c) 70%, transparent); }
.sys-name { display: block; font-size: 1.15rem; font-weight: 650; letter-spacing: -.01em; line-height: 1.1; }
.sys-role { display: block; margin-top: 3px; font-size: .8rem; color: var(--text-3); line-height: 1.3; }

.box {
  position: relative; display: block; padding: 10px 12px; border-radius: var(--r-md);
  background: var(--surface-1); border: 1px solid var(--border);
  transition: border-color var(--t-slow) var(--ease), background var(--t-slow) var(--ease);
}
.box-k { display: block; color: var(--text-3); font-size: .66rem; }
.box-v { display: block; margin-top: 2px; font-size: .92rem; font-weight: 560; }
.box.fe::after { /* połączenie frontend → API w obrębie jednego systemu */
  content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 15px;
  background: var(--border-strong);
}
.sys[aria-selected="true"] .box { border-color: color-mix(in srgb, var(--c) 35%, transparent); background: color-mix(in srgb, var(--c) 5%, var(--surface-1)); }
.sys[aria-selected="true"] .box.fe::after { background: color-mix(in srgb, var(--c) 60%, transparent); }

/* Pasmo komunikacji REST między backendami — bez sugerowania topologii par */
.eco-rail {
  position: absolute; z-index: 1; left: -8px; right: -8px; top: 0; height: 0;
  border-radius: 16px; border: 1px dashed rgb(255 255 255 / .11);
  background: rgb(255 255 255 / .018);
}
.eco-rail::before, .eco-rail::after {
  content: ""; position: absolute; left: 14px; right: 14px; height: 1px; opacity: .55;
  background-image: linear-gradient(90deg, var(--text-3) 0 6px, transparent 6px 14px);
  background-size: 14px 1px;
}
.eco-rail::before { top: 5px;    animation: rail-r 2.4s linear infinite; }
.eco-rail::after  { bottom: 5px; animation: rail-l 2.4s linear infinite; }
@keyframes rail-r { to { background-position: 14px 0; } }
@keyframes rail-l { to { background-position: -14px 0; } }

.eco-wires { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.stem { stroke: rgb(255 255 255 / .2); stroke-width: 1.25; stroke-dasharray: 3 5; animation: stem 1.6s linear infinite; transition: stroke var(--t-slow) var(--ease); }
.stem.is-active { stroke-width: 1.5; }
@keyframes stem { to { stroke-dashoffset: -16; } }

.eco-db {
  position: relative; z-index: 3; margin-top: 52px;
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface-1));
  border: 1px solid var(--border-strong);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .05);
}
.eco-db .db-icon {
  flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
  background: var(--surface-3); color: var(--text-2);
}
.eco-db .db-icon svg { width: 20px; height: 20px; }
.db-title { display: block; font-weight: 600; }
.db-sub { display: block; color: var(--text-3); font-size: .72rem; margin-top: 2px; }

.eco-legend { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px 22px; color: var(--text-3); font-size: .84rem; }
.eco-legend li { display: inline-flex; align-items: center; gap: 10px; }
.eco-legend svg { width: 28px; height: 14px; flex: none; }

/* Sticky przełącznik — tylko telefon (panel jest długi, mapa znika z widoku) */
.eco-seg { display: none; }
@media (max-width: 767px) {
  .eco-seg {
    position: sticky; top: calc(var(--header-h) + 8px); z-index: 20;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px;
    border-radius: 14px; border: 1px solid var(--border);
    background: rgb(17 20 27 / .86);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .seg-btn {
    --c: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
    border: 1px solid transparent; border-radius: 10px; background: transparent; cursor: pointer;
    font-weight: 600; font-size: .95rem; color: var(--text-2);
    transition: background var(--t-base) var(--ease), color var(--t-base) var(--ease);
  }
  .seg-btn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); opacity: .55; }
  .seg-btn[data-sys="b2b"] { --c: var(--sys-b2b); }
  .seg-btn[data-sys="erp"] { --c: var(--sys-erp); }
  .seg-btn[data-sys="wms"] { --c: var(--sys-wms); }
  .seg-btn.is-active {
    color: var(--text);
    background: color-mix(in srgb, var(--c) 16%, transparent);
    border-color: color-mix(in srgb, var(--c) 40%, transparent);
  }
  .seg-btn.is-active::before { opacity: 1; }

  /* kompaktowa mapa */
  .sys { padding: 8px 6px; gap: 10px; text-align: center; }
  .sys-head { flex-direction: column; gap: 6px; }
  .sys-icon { width: 36px; height: 36px; border-radius: 10px; }
  .sys-icon svg { width: 18px; height: 18px; }
  .sys-name { font-size: 1rem; }
  .sys-role { display: none; }
  .box { padding: 8px 4px; }
  .box-k { font-size: .6rem; letter-spacing: .04em; }
  .box-v { font-size: .8rem; }
  .eco-db { margin-top: 40px; padding: 12px; }
  .eco-legend { font-size: .8rem; }
}

/* Panel szczegółów — panele w jednej komórce gridu: wysokość = najwyższy panel, zero CLS */
.eco-panels { display: grid; }
.panel {
  --c: var(--accent);
  grid-area: 1 / 1;
  position: relative; overflow: hidden;
  padding: clamp(22px, 3vw, 34px); border-radius: var(--r-lg);
  background: var(--surface-1); border: 1px solid var(--border);
  visibility: hidden; opacity: 0; transform: translateY(8px);
  transition: opacity 180ms var(--ease), transform 180ms var(--ease), visibility 0s linear 180ms;
}
.panel.is-active { visibility: visible; opacity: 1; transform: none; transition: opacity 180ms var(--ease), transform 180ms var(--ease), visibility 0s; }
.panel[data-sys="b2b"] { --c: var(--sys-b2b); }
.panel[data-sys="erp"] { --c: var(--sys-erp); }
.panel[data-sys="wms"] { --c: var(--sys-wms); }
.panel::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 80%, transparent), transparent);
}
.panel::after {
  content: ""; position: absolute; pointer-events: none; width: 360px; height: 220px; right: -120px; top: -120px;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 16%, transparent), transparent);
}
.panel-head { display: flex; align-items: center; gap: 16px; }
.panel-head .sys-icon { width: 48px; height: 48px; border-radius: 14px; }
.panel-head .sys-icon svg { width: 23px; height: 23px; }
.panel-full { color: var(--text-3); font-size: .72rem; }
.panel h3 { font-size: clamp(1.6rem, 1.3rem + 1vw, 2rem); font-weight: 650; letter-spacing: -.02em; line-height: 1.1; margin-top: 2px; }
.panel-lead { margin-top: 18px; color: var(--text-2); }
.panel h4 { margin-top: 26px; margin-bottom: 12px; color: var(--text-3); font-weight: 500; }
.area-list { display: grid; gap: 8px 20px; }
@media (min-width: 520px) { .area-list { grid-template-columns: 1fr 1fr; } }
.area-list li { display: flex; gap: 10px; align-items: baseline; font-size: .95rem; line-height: 1.45; }
.area-list li::before {
  content: ""; flex: none; width: 6px; height: 6px; border-radius: 2px; transform: translateY(-2px);
  background: var(--c);
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-family: var(--font-mono); font-size: .76rem; letter-spacing: .02em;
  padding: 6px 10px; border-radius: var(--r-sm);
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
}
.todo {
  padding: 14px 16px; border-radius: var(--r-md);
  border: 1px dashed color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 5%, transparent);
  color: var(--text-2); font-size: .92rem; line-height: 1.5;
}

/* ============================================================ CONTACT / FOOTER */
.contact-row { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
.site-footer { border-top: 1px solid var(--border); padding-block: 28px; color: var(--text-3); font-size: .85rem; }
.site-footer .container { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

/* ============================================================ REDUCED MOTION */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  .signal { display: none; }
}

      pl: ['Obsługa zamówień magazynowych', 'Rezerwacje stanów', 'Kompletacja', 'Pakowanie i weryfikacja', 'Identyfikacja produktów i numery seryjne', 'Interfejsy operatorów magazynowych'],
      en: ['Warehouse order handling', 'Stock reservations', 'Picking', 'Packing and verification', 'Product identification and serial numbers', 'Warehouse operator interfaces'],
    },
  },
];
const SHARED_TECH = ['Angular', 'TypeScript', 'NestJS', 'MySQL / MariaDB'];

/* ============================================================ STATE */
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)');
let lang = 'pl';
let active = 'erp';

/* ============================================================ I18N */
function t(key) {
  const value = UI[lang][key];
  if (value === undefined) console.warn('Missing translation:', lang, key);
  return value ?? key;
}

function setLang(next) {
  lang = next;
  document.documentElement.lang = next;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === next)));
  renderEcosystem();
}
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

/* ============================================================ ECOSYSTEM */
const tabsEl = document.getElementById('eco-tabs');
const segEl = document.getElementById('eco-seg');
const panelsEl = document.getElementById('eco-panels');
const mapEl = document.getElementById('eco-map');

function renderEcosystem() {
  tabsEl.innerHTML = SYSTEMS.map((s) => `
    <button class="sys" type="button" role="tab" id="tab-${s.id}" data-sys="${s.id}"
            aria-controls="panel-${s.id}" aria-selected="false" tabindex="-1">
      <span class="sys-head">
        <span class="sys-icon">${icon(s.icon)}</span>
        <span><span class="sys-name">${s.name}</span><span class="sys-role">${s.role[lang]}</span></span>
      </span>
      <span class="box fe"><span class="box-k mono">Frontend</span><span class="box-v">Angular</span></span>
      <span class="box api"><span class="box-k mono">API</span><span class="box-v">NestJS</span></span>
    </button>`).join('');

  segEl.innerHTML = SYSTEMS.map((s) =>
    `<button class="seg-btn" type="button" tabindex="-1" data-sys="${s.id}">${s.name}</button>`).join('');

  panelsEl.innerHTML = SYSTEMS.map((s) => `
    <div class="panel" role="tabpanel" id="panel-${s.id}" aria-labelledby="tab-${s.id}" data-sys="${s.id}">
      <div class="panel-head">
        <span class="sys-icon" style="--c: var(--sys-${s.id})">${icon(s.icon)}</span>
        <div><p class="panel-full mono">${s.full[lang]}</p><h3>${s.name}</h3></div>
      </div>
      <p class="panel-lead">${s.lead[lang]}</p>
      <h4 class="mono">${t('eco.areas')}</h4>
      <ul class="area-list">${s.areas[lang].map((a) => `<li>${a}</li>`).join('')}</ul>
      <h4 class="mono">${t('eco.tech')}</h4>
      <ul class="chips">${SHARED_TECH.map((x) => `<li class="chip">${x}</li>`).join('')}</ul>
      <h4 class="mono">${t('eco.role')}</h4>
      <p class="todo">${t('eco.roleTodo')}</p>
    </div>`).join('');

  wiresBuilt = false;
  select(active, false);
}

function select(id, focus) {
  active = id;
  tabsEl.querySelectorAll('.sys').forEach((tab) => {
    const on = tab.dataset.sys === id;
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
    if (on && focus) tab.focus();
  });
  segEl.querySelectorAll('.seg-btn').forEach((b) => b.classList.toggle('is-active', b.dataset.sys === id));
  panelsEl.querySelectorAll('.panel').forEach((p) => p.classList.toggle('is-active', p.dataset.sys === id));
  layoutWires();
}

tabsEl.addEventListener('click', (e) => {
  const tab = e.target.closest('.sys');
  if (tab) select(tab.dataset.sys, false);
});
tabsEl.addEventListener('keydown', (e) => {
  const ids = SYSTEMS.map((s) => s.id);
  const i = ids.indexOf(active);
  const map = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: ids.length - 1 };
  if (!(e.key in map)) return;
  e.preventDefault();
  select(ids[(map[e.key] + ids.length) % ids.length], true);
});
segEl.addEventListener('click', (e) => {
  const b = e.target.closest('.seg-btn');
  if (!b) return;
  select(b.dataset.sys, false);
  // Jeśli użytkownik jest w połowie panelu — pokaż początek nowego panelu tuż pod paskiem.
  const segBottom = segEl.getBoundingClientRect().bottom;
  const panelTop = panelsEl.getBoundingClientRect().top;
  if (panelTop < segBottom) {
    window.scrollBy({ top: panelTop - segBottom - 12, behavior: prefersReduced.matches ? 'auto' : 'smooth' });
  }
});

/* Pasmo REST + łącza do bazy: mierzone z layoutu, więc działa na każdej szerokości */
const SVG_NS = 'http://www.w3.org/2000/svg';
const railEl = document.getElementById('eco-rail');
const wiresEl = document.getElementById('eco-wires');
let wiresBuilt = false;

function layoutWires() {
  const apis = [...tabsEl.querySelectorAll('.box.api')];
  const db = mapEl.querySelector('.eco-db');
  if (!apis.length) return;
  const m = mapEl.getBoundingClientRect();
  const rects = apis.map((a) => a.getBoundingClientRect());
  const top = Math.min(...rects.map((r) => r.top)) - m.top;
  const bottom = Math.max(...rects.map((r) => r.bottom)) - m.top;
  railEl.style.top = `${top - 14}px`;
  railEl.style.height = `${bottom - top + 28}px`;

  const dbTop = db.getBoundingClientRect().top - m.top;
  wiresEl.setAttribute('viewBox', `0 0 ${m.width} ${m.height}`);
  if (!wiresBuilt) {
    wiresEl.innerHTML = '';
    SYSTEMS.forEach((s) => {
      const line = document.createElementNS(SVG_NS, 'line');
      line.classList.add('stem');
      line.dataset.sys = s.id;
      wiresEl.appendChild(line);
    });
    wiresBuilt = true;
  }
  wiresEl.querySelectorAll('.stem').forEach((line, i) => {
    const r = rects[i];
    const x = r.left + r.width / 2 - m.left;
    line.setAttribute('x1', x); line.setAttribute('x2', x);
    line.setAttribute('y1', r.bottom - m.top + 1);
    line.setAttribute('y2', dbTop);
    const on = line.dataset.sys === active;
    line.classList.toggle('is-active', on);
    line.style.stroke = on ? `var(--sys-${active})` : '';
  });
}
new ResizeObserver(() => layoutWires()).observe(mapEl);
document.fonts?.ready.then(layoutWires);

/* ============================================================ HERO VISUAL — „Bounded Contexts” */
(function buildHero() {
  const svg = document.getElementById('hero-svg');
  const S = 26, G = 12, P = 16;
  const clusters = [
    { x: 30,  y: 40,  c: 3, r: 2 },
    { x: 300, y: 20,  c: 4, r: 2 },
    { x: 70,  y: 250, c: 3, r: 3 },
    { x: 319, y: 230, c: 3, r: 2 },
    { x: 360, y: 380, c: 2, r: 1, optional: true },
  ];
  const dots = { '0-4': 'erp', '1-1': 'b2b', '1-6': 'erp', '2-5': 'wms', '3-0': 'erp', '3-5': 'b2b', '4-1': 'wms' };
  const wires = [
    { d: 'M164 88 H226 a8 8 0 0 0 8 -8 V76 a8 8 0 0 1 8 -8 H300', signal: 0 },
    { d: 'M97 136 V185 a8 8 0 0 0 8 8 H129 a8 8 0 0 1 8 8 V250' },
    { d: 'M386 116 V230', signal: 5.4 },
    { d: 'M204 317 H254 a8 8 0 0 0 8 -8 V286 a8 8 0 0 1 8 -8 H319', signal: 1.8 },
    { d: 'M386 326 V344 a8 8 0 0 0 8 8 H400 a8 8 0 0 1 8 8 V380', optional: true },
    { d: 'M137 384 V401 a8 8 0 0 0 8 8 H360', optional: true, signal: 3.6 },
  ];

  let wiresSvg = '';
  for (const w of wires) {
    const cls = w.optional ? ' optional' : '';
    wiresSvg += `<path class="wire${cls}" d="${w.d}"/>`;
    if (w.signal !== undefined) {
      wiresSvg += `<path class="signal${cls}" d="${w.d}" pathLength="100" style="animation-delay:${w.signal}s"/>`;
    }
  }

  let modsSvg = '';
  const modules = [];
  clusters.forEach((cl, ci) => {
    const w = 2 * P + cl.c * S + (cl.c - 1) * G;
    const h = 2 * P + cl.r * S + (cl.r - 1) * G;
    const cls = cl.optional ? ' class="optional"' : '';
    modsSvg += `<g${cls}><rect class="ctx" x="${cl.x}" y="${cl.y}" width="${w}" height="${h}" rx="16"/>`;
    let mi = 0;
    for (let r = 0; r < cl.r; r++) {
      for (let c = 0; c < cl.c; c++, mi++) {
        const x = cl.x + P + c * (S + G), y = cl.y + P + r * (S + G);
        modsSvg += `<rect class="mod" x="${x}" y="${y}" width="${S}" height="${S}" rx="7"/>`;
        modsSvg += `<rect class="mod-hl" x="${x}" y="${y}" width="${S}" height="${S}" rx="7"/>`;
        const dot = dots[`${ci}-${mi}`];
        if (dot) modsSvg += `<circle cx="${x + S / 2}" cy="${y + S / 2}" r="3.5" fill="var(--sys-${dot})"/>`;
        modules.push({ cx: x + S / 2, cy: y + S / 2 });
      }
    }
    modsSvg += '</g>';
  });

  svg.innerHTML = `<g class="hv-layer" id="hv-wires">${wiresSvg}</g><g class="hv-layer" id="hv-mods">${modsSvg}</g>`;

  // Interakcja tylko dla precyzyjnego wskaźnika z hoverem i bez reduced-motion.
  const canHover = matchMedia('(hover: hover) and (pointer: fine)');
  if (!canHover.matches || prefersReduced.matches) return;

  const hero = document.querySelector('.hero');
  const hls = [...svg.querySelectorAll('.mod-hl')];
  const layerMods = document.getElementById('hv-mods');
  const layerWires = document.getElementById('hv-wires');
  let frame = 0, last = null;

  function update() {
    frame = 0;
    if (!last) return;
    const pt = new DOMPoint(last.clientX, last.clientY).matrixTransform(svg.getScreenCTM().inverse());
    hls.forEach((hl, i) => {
      const m = modules[i];
      const d = Math.hypot(m.cx - pt.x, m.cy - pt.y);
      hl.style.opacity = String(Math.max(0, 1 - d / 150) * 0.5);
    });
    const r = hero.getBoundingClientRect();
    const nx = (last.clientX - r.left) / r.width - 0.5;
    const ny = (last.clientY - r.top) / r.height - 0.5;
    layerMods.style.transform = `translate(${nx * 10}px, ${ny * 8}px)`;
    layerWires.style.transform = `translate(${nx * 5}px, ${ny * 4}px)`;
  }
  hero.addEventListener('pointermove', (e) => { last = e; if (!frame) frame = requestAnimationFrame(update); });
  hero.addEventListener('pointerleave', () => {
    last = null;
    hls.forEach((hl) => { hl.style.opacity = '0'; });
    layerMods.style.transform = layerWires.style.transform = '';
  });
})();

/* ============================================================ HEADER, MOBILE NAV, SCROLLSPY */
const header = document.querySelector('.site-header');
const onScroll = () => header.classList.toggle('is-scrolled', window.scrollY > 8);
addEventListener('scroll', onScroll, { passive: true });
onScroll();

const mnav = document.getElementById('mnav');
document.querySelector('.menu-btn[aria-controls="mnav"]').addEventListener('click', () => mnav.showModal());
mnav.querySelector('[data-close]').addEventListener('click', () => mnav.close());
mnav.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener('click', () => mnav.close()));
matchMedia('(min-width: 960px)').addEventListener('change', (e) => { if (e.matches && mnav.open) mnav.close(); });

const spyLinks = [...document.querySelectorAll('.nav-link, .mnav-list a')];
const spy = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (!entry.isIntersecting) return;
    const id = `#${entry.target.id}`;
    spyLinks.forEach((a) => {
      if (a.getAttribute('href') === id) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
  });
}, { rootMargin: '-45% 0px -50% 0px' });
document.querySelectorAll('main section[id]').forEach((s) => spy.observe(s));

setLang('pl');
</script>
</body>
