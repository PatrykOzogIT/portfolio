<div class="container inner">
  <!-- Accessible name = the visible name (label in name); the "PO" monogram is CSS-generated graphics. -->
  <a class="brand" [routerLink]="['/', lang()]">
    <span class="brand-mark mono" aria-hidden="true"></span>
    <span class="brand-name">{{ name }}</span>
    <span class="visually-hidden"> — {{ t().a11y.homeLink }}</span>
  </a>

  <nav class="nav" [attr.aria-label]="t().a11y.mainNav">
    <ul role="list">
      @for (item of nav.items(); track item.id) {
        <li>
          <a
            class="nav-link"
            [routerLink]="['/', lang()]"
            [fragment]="item.id"
            [attr.aria-current]="nav.active() === item.id ? 'true' : null"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>
  </nav>

  <div class="actions">
    <app-lang-switch />
    @if (nav.hasContact) {
      <a
        class="cta"
        appButton
        variant="primary"
        size="sm"
        [routerLink]="['/', lang()]"
        fragment="contact"
        [attr.aria-current]="nav.active() === 'contact' ? 'true' : null"
      >
        {{ t().nav.contact }}
      </a>
    }
    <app-mobile-nav />
  </div>
</div>
