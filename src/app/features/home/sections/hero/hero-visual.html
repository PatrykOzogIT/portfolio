<svg #svg viewBox="0 0 500 460" focusable="false">
  <g class="layer" data-depth="5">
    @for (wire of wires; track $index) {
      <path class="wire" [attr.d]="wire.d" />
      @if (wire.signalDelay !== undefined) {
        <path
          class="signal"
          [attr.d]="wire.d"
          pathLength="100"
          [style.animation-delay.s]="wire.signalDelay"
        />
      }
    }
  </g>
  <g class="layer" data-depth="10">
    @for (box of boxes; track $index) {
      <rect
        class="ctx"
        [attr.x]="box.x"
        [attr.y]="box.y"
        [attr.width]="box.width"
        [attr.height]="box.height"
        rx="16"
      />
    }
    @for (m of modules; track $index) {
      <g>
        <rect
          class="mod"
          [attr.x]="m.x"
          [attr.y]="m.y"
          [attr.width]="size"
          [attr.height]="size"
          rx="7"
        />
        <rect
          class="mod-hl"
          [attr.x]="m.x"
          [attr.y]="m.y"
          [attr.width]="size"
          [attr.height]="size"
          rx="7"
        />
        @if (m.dot) {
          <circle
            [attr.cx]="m.cx"
            [attr.cy]="m.cy"
            r="3.5"
            [style.fill]="'var(--sys-' + m.dot + ')'"
          />
        }
      </g>
    }
  </g>
</svg>
