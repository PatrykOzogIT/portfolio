<section class="hero" aria-labelledby="hero-title">
  <div class="container">
    <p class="eyebrow mono">{{ site.person.jobTitle }} · Software Architecture</p>
    <h1 id="hero-title" class="display">{{ site.person.name }}</h1>
    <p class="lead hero-lead">{{ t().hero.lead }}</p>
  </div>
</section>

@for (id of sections; track id) {
  <section class="section" [id]="id" [attr.aria-labelledby]="id + '-title'">
    <div class="container">
      <app-section-heading [headingId]="id + '-title'" [title]="t().nav[id]" />
    </div>
  </section>
}
